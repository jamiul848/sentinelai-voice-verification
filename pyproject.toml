[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelai-voice-verification"
version = "0.1.0"
description = "SentinelAI Autonomous Voice Verification and Cyber Defense Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "speechbrain>=1.0.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "python-multipart>=0.0.9",
    "numpy>=1.24.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
    "greenlet>=3.0.0",
    "alembic>=1.12.0",
    "pydantic-settings>=2.0.0",
    "cryptography>=41.0.0",
    "aiosqlite>=0.19.0",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: Real pretrained model integration tests requiring model download or checkpoint loading",
]
